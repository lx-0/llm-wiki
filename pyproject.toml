[project]
name = "llm-wiki"
version = "0.5.4"
description = "Personal knowledge wiki compiled from conversations and curated sources — based on Karpathy's LLM Wiki + Cole's claude-memory-compiler"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alex Wegener" },
]
requires-python = ">=3.12"
dependencies = [
    # httpx: engine-wide HTTP client (ollama, oura, jamie, publish). Declared
    # 2026-08-25 (M030-S02-T01) — was a latent transitive-dep violation.
    "httpx",
    # The floor is load-bearing, not cosmetic: the API refuses Claude CLI
    # builds below a server-side minimum (2026-09-09: "version 2.1.251 or
    # newer is required", error_code claude_code_version_too_old) and every
    # SDK call then dies as `cli_outdated`. 0.2.148 is the first SDK that
    # bundles CLI 2.1.251. When that floor moves again, bump this AND the
    # lock (`uv lock --upgrade-package claude-agent-sdk`) in one commit.
    "claude-agent-sdk>=0.2.148",
    "html2text>=2025.4.15",
    "imapclient>=3.0.0",
    # Required by collectors/_picture_metadata.py for EXIF parsing on
    # JPEG/PNG sources. Used to be a transitive dep of yt-dlp on some
    # platforms but not reliably resolved across uv environments.
    "pillow>=10.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "yt-dlp>=2026.1.0",
    "youtube-transcript-api>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/lx-0/llm-wiki"
Repository = "https://github.com/lx-0/llm-wiki"
Issues = "https://github.com/lx-0/llm-wiki/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
