[project]
name = "llm-wiki"
version = "0.7.22"
description = "Personal knowledge wiki compiled from conversations and curated sources — based on Karpathy's LLM Wiki + Cole's claude-memory-compiler"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alex Wegener" },
]
requires-python = ">=3.12"
dependencies = [
    # httpx: engine-wide HTTP client (ollama, oura, jamie, publish). Declared
    # 2026-08-25 (M030-S02-T01) — was a latent transitive-dep violation.
    "httpx",
    # The floor is load-bearing, not cosmetic: the API refuses Claude CLI
    # builds below a server-side minimum (2026-09-09: "version 2.1.251 or
    # newer is required", error_code claude_code_version_too_old) and every
    # SDK call then dies as `cli_outdated`. 0.2.148 is the first SDK that
    # bundles CLI 2.1.251. When that floor moves again, bump this AND the
    # lock (`uv lock --upgrade-package claude-agent-sdk`) in one commit.
    "claude-agent-sdk>=0.2.148",
    "html2text>=2025.4.15",
    "imapclient>=3.0.0",
    # Required by collectors/_picture_metadata.py for EXIF parsing on
    # JPEG/PNG sources. Used to be a transitive dep of yt-dlp on some
    # platforms but not reliably resolved across uv environments.
    "pillow>=10.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "yt-dlp>=2026.1.0",
    "youtube-transcript-api>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/lx-0/llm-wiki"
Repository = "https://github.com/lx-0/llm-wiki"
Issues = "https://github.com/lx-0/llm-wiki/issues"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
]
lint = [
    "ruff==0.16.10",
]
typecheck = [
    "ty==0.0.88",
]

[tool.ruff]
line-length = 100
# scripts/ is the source root (tests run with pythonpath = ["scripts"]): lets the import
# sorter file `core`, `collectors`, … as first-party instead of third-party.
src = ["scripts", "tests"]
# pre-commit and editors pass paths explicitly; without this, `exclude` lists below would
# only apply to discovered files and the hand-formatted file would get reformatted anyway.
force-exclude = true
# ruff ≥ 0.16 formats the Python fences inside Markdown by default. The fences in
# `.ytstack/**`, `CONTEXT.md` and the backlog are illustrative snippets whose spacing is prose
# (one bare `ruff format` rewrote 19 of them on 2026-10-15, one into a tuple assignment).
# Markdown is out of ruff's reach entirely; the gates pass `scripts hooks tests` anyway.
extend-exclude = ["*.md"]

[tool.ruff.format]
# core/config_schema.py is read as TEXT by core/config_docs.py: the field comments become
# docs/config.md. ruff's wrapping moves trailing comments off the field line and the
# generator drops them (eight descriptions went to "—" on 2026-10-14). The file is 72 %
# comment by design (deslop-arc audit: "leave it") — formatted by hand, linted like the rest.
exclude = ["scripts/core/config_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL", "C90"]
# Every ignore carries its reason; a rule leaves this list when the reason stops being true
# (counts measured 2026-10-14 on the formatted tree, M033-S01-T03).
ignore = [
    # lazy imports inside functions are the engine's startup-time and cycle-avoidance
    # pattern (KNOWLEDGE "lazy-import CLI module"); 999 sites, all deliberate
    "PLC0415",
    # the thresholds that matter are config knobs (core/config_schema.py); the 511 left are
    # formats, offsets and test expectations
    "PLR2004",
    # the formatter owns line length; the 200 left are strings, URLs and comments it cannot wrap
    "E501",
    # en-dashes, arrows and ellipses in strings, docstrings and comments are typography, not typos
    "RUF001", "RUF002", "RUF003",
    # function-local constants (regex tables, sentinels, the Windows CREATE_NO_WINDOW flag,
    # test shorthands like `P = Producer`) are named like constants on purpose
    "N806",
    # complexity family: M033-S04 gates function LENGTH with a committed AST test
    # (tests/test_function_length.py); complexity thresholds are revisited at the S04 close
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# re-exports are the package API
"**/__init__.py" = ["F401"]
# test fakes declare class-level dicts / lists as fixture data; no instance shares them
"tests/**" = ["RUF012"]
# code before imports that is deliberate: flush.py sanitises the SDK env before the SDK
# import; lint.py sets CLAUDE_INVOKED_BY before the SDK import and keeps the LLM check's
# imports beside it; test_sdk_helpers.py keeps each section's imports beside the section;
# the hooks must import their own bootstrap before anything from scripts/
"scripts/flush.py" = ["E402"]
"scripts/lint.py" = ["E402"]
"tests/test_sdk_helpers.py" = ["E402"]
"hooks/*.py" = ["E402"]

# ty (Astral) is the type checker — chosen over pyright / basedpyright by the M033-S05-T01
# probe (DECISIONS 2026-10-15). A 0.0.x beta, pinned exactly in the `typecheck` group: an
# upgrade is a deliberate bump + re-run, never a drift. Run: `uv run --group typecheck ty
# check scripts/core`. The third-party packages resolve from the project's `.venv`.
[tool.ty.environment]
python-version = "3.12"
# scripts/ is the engine's source root (imports are `core.*`), hooks/ holds `_bootstrap`
extra-paths = ["scripts", "hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is the engine's source root; hooks/ holds `_transcript` + `_bootstrap`, which the
# hook tests import directly. Applied before conftest import — no test inserts into sys.path.
pythonpath = ["scripts", "hooks"]
