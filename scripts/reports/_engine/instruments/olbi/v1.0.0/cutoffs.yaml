# OLBI burnout bands (commonly cited thresholds; no single published
# canonical-cutoff like PHQ-9 has). 16 items × 5-point scale (1-5) =
# total range 16-80, with reverse-coded items normalised so higher =
# more burnout uniformly.
- {min: 16, max: 31, band: "low"}
- {min: 32, max: 47, band: "moderate"}
- {min: 48, max: 63, band: "high"}
- {min: 64, max: 80, band: "very-high"}
