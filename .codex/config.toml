# Project permissions requested by Alex, 2026-10-09.
# No interactive approval prompts; filesystem access stays scoped below.
approval_policy = "never"
default_permissions = "wiki-development"

[permissions.wiki-development]
description = "Wiki development, Git operations and configured local vault deployment."
extends = ":workspace"

[permissions.wiki-development.filesystem.":workspace_roots"]
".git" = "write"

[permissions.wiki-development.network]
enabled = true
