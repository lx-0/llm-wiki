name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 03:17 UTC — catches leaks introduced via direct push to forks/branches
    # before they age into history. Cron skew chosen to avoid the top-of-hour stampede.
    - cron: '17 3 * * *'

permissions:
  contents: read
  # gitleaks-action posts a comment on PRs when leaks are found
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan past commits, not just HEAD.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only required for org accounts >25 contributors;
          # personal/small repos run free.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
