name: ci

# The engine and desktop gates, on every push and PR to main. Same commands as the
# local gates (AGENTS.md "Style"): ruff check + format --check + ty (scripts/core) +
# pytest for the engine,
# tsc + svelte-check + vitest + biome for the desktop app. The screenshot harness
# (`npm run shots`) needs an Electron display and stays a local gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (ruff + ty + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (locked, with the lint + typecheck groups)
        run: uv sync --frozen --group lint --group typecheck

      - name: ruff check
        run: uv run --frozen --group lint ruff check scripts hooks tests

      - name: ruff format --check
        run: uv run --frozen --group lint ruff format --check scripts hooks tests

      # The gate: scripts/core/ type-checks clean (DECISIONS 2026-10-15).
      - name: ty check scripts/core
        run: uv run --frozen --group typecheck ty check scripts/core

      # Reported, not gated: the rest of scripts/ (the count in the log; KNOWLEDGE keeps it).
      - name: ty check scripts (report only)
        run: uv run --frozen --group typecheck ty check scripts --exit-zero --output-format concise

      - name: pytest
        run: uv run --frozen pytest -q -p no:cacheprovider

  desktop:
    name: desktop (typecheck + vitest + biome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test (tsc + svelte-check + vitest)
        run: npm test

      - name: biome
        run: npm run lint
