<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>llm-wiki — Cockpit</title>
  </head>
  <body class="cockpit">
    <canvas id="cockpit-canvas"></canvas>

    <header class="ck-top">
      <div class="ck-brand">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.4c-1.4-.8-3.4-.3-4 1.2-1.5.1-2.6 1.3-2.6 2.8 0 .3 0 .6.1.9-1 .5-1.6 1.5-1.6 2.6 0 .9.4 1.7 1.1 2.2-.2.4-.3.8-.3 1.3 0 1.5 1.2 2.7 2.8 2.8.5.9 1.5 1.5 2.6 1.5h1.8V4.9" />
          <path d="M13 4.4c1.4-.8 3.4-.3 4 1.2 1.5.1 2.6 1.3 2.6 2.8 0 .3 0 .6-.1.9 1 .5 1.6 1.5 1.6 2.6 0 .9-.4 1.7-1.1 2.2.2.4.3.8.3 1.3 0 1.5-1.2 2.7-2.8 2.8-.5.9-1.5 1.5-2.6 1.5h-1.8V4.9" />
        </svg>
        <span class="ck-name">llm-wiki</span>
        <span id="ck-vault" class="ck-vault"></span>
      </div>
      <button id="ck-compact" class="ck-btn">⊟ Compact</button>
    </header>

    <div class="ck-center">
      <div id="ck-stat" class="ck-stat"></div>
      <div id="ck-health" class="ck-health"></div>
    </div>

    <aside class="ck-panel ck-recent">
      <div class="ck-panel-title">Recent</div>
      <div id="ck-recent-list"></div>
    </aside>

    <div class="ck-ask">
      <input id="ck-input" type="text" placeholder="Ask your wiki…" autocomplete="off" spellcheck="false" />
      <button id="ck-ask-btn" class="ck-btn primary">Ask</button>
      <div id="ck-answer" class="ck-answer" hidden></div>
    </div>

    <script type="module" src="/src/cockpit.ts"></script>
  </body>
</html>
