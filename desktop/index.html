<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>llm-wiki</title>
  </head>
  <body class="panel">
    <div class="sticky-top">
      <header class="app">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4.4c-1.4-.8-3.4-.3-4 1.2-1.5.1-2.6 1.3-2.6 2.8 0 .3 0 .6.1.9-1 .5-1.6 1.5-1.6 2.6 0 .9.4 1.7 1.1 2.2-.2.4-.3.8-.3 1.3 0 1.5 1.2 2.7 2.8 2.8.5.9 1.5 1.5 2.6 1.5h1.8V4.9" />
          <path d="M13 4.4c1.4-.8 3.4-.3 4 1.2 1.5.1 2.6 1.3 2.6 2.8 0 .3 0 .6-.1.9 1 .5 1.6 1.5 1.6 2.6 0 .9-.4 1.7-1.1 2.2.2.4.3.8.3 1.3 0 1.5-1.2 2.7-2.8 2.8-.5.9-1.5 1.5-2.6 1.5h-1.8V4.9" />
          <circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none" />
          <circle cx="15.5" cy="13.5" r="1" fill="currentColor" stroke="none" />
        </svg>
        <span class="brand">llm-wiki</span>
        <span id="vault-meta" class="vault-meta"></span>
        <button id="cockpit-btn" class="gear" title="Dashboard — your knowledge at a glance" aria-label="Dashboard">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        </button>
        <button id="atlas-btn" class="gear" title="Map — how your notes connect" aria-label="Map">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M7 7l9 4M7 17l9-4"/></svg>
        </button>
        <button id="browse-btn" class="gear" title="Browse all your notes" aria-label="Browse">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="triage-btn" class="gear" title="Sort new captures" aria-label="Sort captures">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span id="triage-badge" class="hdr-badge" hidden></span>
        </button>
        <button id="settings-btn" class="gear" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>
      <div class="ask-bar">
        <input id="ask-input" type="text" placeholder="Ask your wiki anything…" autocomplete="off" spellcheck="false" />
        <button id="ask-btn" class="compile">Ask</button>
      </div>
    </div>
    <main class="body-scroll">
      <div id="nav-hint" class="nav-hint" hidden>
        <span>↑ The icons above open your <b>Dashboard</b>, <b>Map</b>, all your <b>Notes</b>, and the <b>captures to sort</b>.</span>
        <button id="nav-hint-x" class="nav-hint-x">Got it</button>
      </div>
      <div id="ask-answer" class="ask-answer" hidden></div>
      <section id="vault" class="vault"></section>
      <div id="vault-yield" class="vault-yield"></div>
      <div id="health" class="health"></div>
      <h2 class="section-label">Add to wiki</h2>
      <div class="add-card card">
        <div class="add-row">
          <input id="add-input" type="text" placeholder="Paste a link — web page or YouTube…" autocomplete="off" spellcheck="false" />
          <button id="add-btn" class="ghost">Add</button>
        </div>
        <div id="add-status" class="add-status" hidden></div>
      </div>
      <div id="recent"></div>
      <div id="pending"></div>
      <h2 class="section-label">Listeners</h2>
      <ul id="listeners"></ul>
      <details id="sources" class="disclosure">
        <summary>Sync sources</summary>
        <div id="sources-list" class="advanced-actions"></div>
      </details>
      <details id="advanced" class="disclosure">
        <summary>Advanced</summary>
        <div id="advanced-actions" class="advanced-actions"></div>
      </details>
      <footer class="footer">
        <button id="quit" class="quit">Quit</button>
      </footer>
    </main>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
