<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>llm-wiki Settings</title>
  </head>
  <body class="settings">
    <h1 class="settings-title">Settings</h1>

    <div class="settings-card">
      <div class="settings-section">Library</div>
      <div id="set-vault" class="set-vault">…</div>
      <button id="set-open" class="ghost set-open">Open in Obsidian</button>
    </div>

    <div class="settings-card">
      <label class="setting-row">
        <span class="setting-label">
          Start at login
          <span class="setting-sub">Launch llm-wiki automatically when you log in</span>
        </span>
        <input type="checkbox" id="login-toggle" class="switch" />
      </label>
      <div class="setting-row">
        <span class="setting-label">
          File access
          <span class="setting-sub" id="fda-sub">Checking…</span>
        </span>
        <button id="fda-btn" class="ghost" hidden>Open Settings</button>
      </div>
      <div class="setting-row">
        <span class="setting-label">
          Screen &amp; audio capture
          <span class="setting-sub" id="cap-sub">Checking…</span>
        </span>
      </div>
    </div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
