<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="llm-wiki — self-cartography engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>

  <!-- Wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">
    <text x="64" y="118" font-size="84" font-weight="700" letter-spacing="-2">
      llm<tspan fill="url(#accent)">-</tspan>wiki
    </text>
    <text x="68" y="162" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="2">
      SELF-CARTOGRAPHY ENGINE
    </text>
  </g>

  <!-- Tagline -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, sans-serif" fill="#cbd5e1">
    <text x="64" y="220" font-size="22" font-weight="400">
      AI memories <tspan fill="#64748b">·</tspan> sessions <tspan fill="#64748b">·</tspan> scans <tspan fill="#64748b">·</tspan> clippings
    </text>
    <text x="64" y="252" font-size="22" font-weight="400">
      <tspan fill="url(#accent)" font-weight="600">→</tspan> an LLM-compiled Obsidian wiki you and your agents read from daily.
    </text>
  </g>

  <!-- Footer chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">
    <text x="64" y="294">compile-once · query-fast · cockpit-not-warehouse</text>
  </g>

  <!-- Pipeline glyph -->
  <g transform="translate(820,80)" filter="url(#glow)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">
      <!-- raw -->
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="26" font-weight="600">raw/</text>
      <text x="60" y="44" fill="#64748b">sources</text>

      <!-- arrow raw → compile -->
      <line x1="120" y1="28" x2="160" y2="28" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- compile -->
      <rect x="168" y="0" width="120" height="56" rx="8" fill="#1e293b" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="228" y="26" font-weight="600">compile.py</text>
      <text x="228" y="44" fill="#94a3b8">claude sdk</text>

      <!-- arrow compile → knowledge -->
      <line x1="288" y1="28" x2="328" y2="28" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <!-- knowledge -->
      <rect x="336" y="0" width="120" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="396" y="26" font-weight="600">knowledge/</text>
      <text x="396" y="44" fill="#64748b">wikilinks</text>

      <!-- curiosity loop -->
      <path d="M396 56 q 0 60 -168 60 q -168 0 -168 -60" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="228" y="132" fill="#64748b" font-size="11">curiosity loop · gaps → next compile</text>
    </g>
  </g>
</svg>
