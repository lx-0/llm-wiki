# pre-commit hooks — local-side defense against leaked secrets and trivial
# style issues. Install once: `pip install pre-commit && pre-commit install`.
# Then every `git commit` runs these hooks; commits with leaks are blocked.

repos:
  # Secrets scanner — must come first so a leak halts the rest fast.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # Uses .gitleaks.toml automatically.

  # File hygiene — cheap, high-signal checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
        # config.example.yaml + workflow files
      - id: check-json
        # agent hook payloads
      - id: detect-private-key
      - id: end-of-file-fixer
        # Vault templates keep their trailing blank lines on purpose (Obsidian inserts
        # them verbatim); the Excalidraw app writes its JSON without a final newline and
        # would fight the hook on every save.
        exclude: ^(templates/|docs/.*\.excalidraw$)
      - id: trailing-whitespace
        exclude: '\.md$'  # Markdown allows trailing whitespace for line breaks
      - id: mixed-line-ending
        args: [--fix=lf]

  # Formatter + linter — the same ruff the engine pins in pyproject.toml's `lint`
  # dependency group (CI runs that one). Keep `rev` and `ruff==x.y.z` on one number.
  # Scope = the CI scope (scripts/, hooks/, tests/); config_schema.py is excluded from
  # the formatter here as well, because pre-commit passes paths explicitly and ruff's
  # `format.exclude` only applies to discovered files.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        files: ^(scripts|hooks|tests)/
        args: [--fix]
      - id: ruff-format
        files: ^(scripts|hooks|tests)/
        exclude: ^scripts/core/config_schema\.py$

  # Type checker — ty, pinned in pyproject.toml's `typecheck` group (DECISIONS
  # 2026-10-15), run through uv so the hook and CI use the same binary. Gated scope =
  # scripts/core/ (the CI gate); the whole tree is checked at once (a type error can
  # surface in a file that did not change), so no filenames are passed.
  - repo: local
    hooks:
      - id: ty
        name: ty check scripts/core
        entry: uv run --frozen --group typecheck ty check scripts/core
        language: system
        files: ^(scripts/core/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
