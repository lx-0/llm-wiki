# Brain Config — single source of truth for all llm-wiki engine scripts.
# Editing this file is fine — scripts re-read it on every run.
# Defaults are defined in scripts/core/config.py (dataclass fields); partial
# overrides are fine — anything missing falls back to its default.

scheduling:
  # Hour-of-day at which auto-compile + piggyback tasks may spawn from flush.py.
  compile_after_hour: 18
  # Dedup window (seconds) for repeated session-flushes of the same session id.
  dedup_window_seconds: 60
  # When true, a real `wiki compile` drains any due piggybacks (dream-cycle,
  # lint, curiosity, daily-digest, …) at the end of the run, bypassing the
  # compile_after_hour evening gate above (per-task cooldowns still rate-limit).
  # Keeps maintenance current for `wiki update && wiki compile`-only workflows
  # that rarely flush. Set false to keep maintenance evening-/flush-only.
  piggybacks_on_compile: true
  # IANA timezone name. Used for compile_after_hour cutoff, daily-log filenames,
  # and "reviewed" timestamps. Default "UTC" works on any install; override to
  # your local timezone (e.g. "Europe/Berlin", "America/New_York", "Asia/Tokyo").
  timezone: UTC
  # M014 dream-cycle per-entity cooldown (days). Entities whose
  # `last_synthesized_at:` frontmatter is younger than this are skipped by
  # `wiki dream --all-entities` and the dream_cycle piggyback. Override per-run
  # with `--ignore-cooldown` (CLI) or `--cooldown-days N`.
  dream_cooldown_days: 7
  # Concept-reconciliation routine: a hard fact reconciled within this many
  # days is skipped by `wiki reconcile` + the concept_reconcile piggyback.
  concept_reconcile_cooldown_days: 14
  # Dream web-research (issue #2). `## Public Profile` refresh cooldown (days).
  # Public profiles change slowly; much longer than the dream cooldown.
  # `wiki dream web-research <slug>` forces a refresh regardless.
  web_research_cooldown_days: 30
  # Insufficient-corpus backoff cap (days). When a dream runs but the agent
  # returns INSUFFICIENT_CORPUS (no synthesizable claims — common on generic-
  # noun slugs whose mention-scan false-matches), the entity is backed off the
  # sweep with an exponential window (dream_cooldown_days × 2^(no_ops-1)) capped
  # here. A successful synthesis clears it. Caps worst-case re-spend on a junk/
  # dormant entity at ~one SDK call per this many days instead of one per sweep.
  # 0 disables. `wiki dream <slug>` always ignores it.
  dream_insufficient_corpus_backoff_max_days: 30
  # M017 — config-driven entity priority for dream-cycle selection. Default
  # behavior (empty config below) is "all entities equal weight, greedy by
  # age" (M014). Set rules to bias which entities get auto-dreamed more
  # often by the piggyback. Resolution: per-entity frontmatter
  # `dream_priority:` overrides config; then paths first-match-wins; else
  # multiplier formula (default × domain × tag × status).
  # See `wiki dream list-candidates` to debug current ranking.
  dream_priority:
    default: 1.0
    # Highest config-precedence — explicit path/glob → weight.
    # Use 0 to exclude (auto-dream skip; operator can still run manually).
    paths: {}
    #   "knowledge/people/alex.md": 5.0           # operator-anchor
    #   "knowledge/areas/personal-*-archived.md": 0   # never auto-dream
    # Domain-axis multipliers (M013 `domain:` frontmatter).
    domain: {}
    #   personal: 1.5
    #   company: 1.8
    # Tag-axis multipliers. tag_strategy = max | sum | first.
    tag_strategy: max
    tags: {}
    #   operator-anchor: 5.0
    #   work-active: 2.5
    #   archive: 0.1
    # Status-axis (M008 areas `status:` etc.).
    status: {}
    #   active: 1.0
    #   dormant: 0.3
    #   retired: 0.05

# Piggyback tasks spawned after compile_after_hour.
# enabled: false → task never runs. cooldown_hours controls the frequency cap.
piggybacks:
  # The 'email' key matches the EmailCollector.SPEC.name (M002+).
  # Pre-M002 configs used 'email_incremental' — that key is no longer read.
  email:
    enabled: true
    cooldown_hours: 24
  lint_structural:
    enabled: true
    cooldown_hours: 24
  review_wiki:
    enabled: true
    cooldown_hours: 168  # weekly
  # The ONLY piggyback that writes OUTSIDE the vault — it autonomously
  # LLM-rewrites the global ~/.claude/CLAUDE.md from compiled cross-project
  # knowledge. Disabled by default (operator decision 2026-06-13): a vault
  # engine shouldn't auto-edit your global agent rules, and an LLM "optimizing
  # for leanness" can silently drop hand-built rules within the 200-line cap.
  # Code is kept — set enabled: true to opt back in.
  optimize_claude_md:
    enabled: false
    cooldown_hours: 24
  # The 'screenshots' key matches ScreenshotsCollector.SPEC.name — it's a
  # Registry-discovered collector (was the hardcoded 'scan_screenshots'
  # legacy piggyback before the 2026-05-14 Protocol port).
  screenshots:
    enabled: true
    cooldown_hours: 24
    max_per_run: 50
  scan_youtube:
    enabled: true
    cooldown_hours: 24
    max_per_run: 10                      # cap inbox-drain per piggyback run
  # Pulls meetings from the Jamie AI public API via collectors/jamie.py.
  # Multi-tenant: requires at least one personal.accounts.<id>.jamie sub-block
  # (kind: jamie-api) whose `api_key_env` resolves to a non-empty environment
  # variable holding a jk_... key. If unset, this piggyback is silently
  # skipped (graceful agnostic).
  jamie:
    enabled: true
    cooldown_hours: 6                    # tighter than scan_youtube — meetings are time-sensitive
    max_per_run: 20
  # Pulls Google Meet / Gemini transcripts from Drive via collectors/gmeet.py.
  # Multi-tenant: requires at least one personal.accounts.<id>.gmeet sub-block
  # (kind: gmeet-api) AND `wiki gmeet-auth <id>` run for that account. Otherwise
  # silently skipped (graceful agnostic).
  gmeet:
    enabled: true
    cooldown_hours: 6                    # tighter than scan_youtube — meetings are time-sensitive
    max_per_run: 20
  # Pulls Google Calendar events via collectors/calendar.py. Multi-tenant:
  # requires at least one personal.accounts.<id>.calendar sub-block
  # (kind: google-calendar) AND `wiki calendar-auth <id>` run for that
  # account. Otherwise silently skipped (graceful agnostic). One markdown
  # file per date is written to raw/notes/calendar/<YYYY-MM-DD>.md;
  # recurring-event series collapse to knowledge/concepts/<slug>.md.
  calendar:
    enabled: true
    cooldown_hours: 6                    # mirrors gmeet/jamie — same temporal sensitivity
    max_per_run: 500                     # per-calendar; multiple selected calendars multiply
  # Inbox-watch for dictated voice notes (collectors/voice.py). Reads
  # *.txt / *.md from `personal.voice_inbox`, writes raw/voice/*.md,
  # archives the source under `<voice_inbox>/.processed/`. Silently
  # skipped when voice_inbox is empty (graceful agnostic).
  voice:
    enabled: true
    cooldown_hours: 1                    # voice is time-sensitive
  # M025 quick-capture inbox-watch (collectors/capture_collector.py). Reads
  # *.txt / *.md / *.html from `personal.capture_inbox`, content-IDs each
  # capture, writes raw/captures/capture-<id>.md (idempotent re-drop), and
  # two-zone-archives the source under raw/inbox-mobile/captures/. Silently
  # skipped when capture_inbox is empty (graceful agnostic).
  capture:
    enabled: true
    cooldown_hours: 1                    # captures are time-sensitive, like voice
  # Inbox-watch for camera / phone photos (collectors/pictures.py). Reads
  # *.jpeg / *.jpg / *.png / *.heic from `personal.picture_inbox`, runs the
  # gemma4 vision pipeline on each, writes a HOME sidecar + 384px vault
  # thumbnail + a per-batch report under `raw/notes/pictures/`, then
  # archives the source under `<picture_inbox>/.processed/`. Silently
  # skipped when picture_inbox is empty (graceful agnostic).
  pictures:
    enabled: true
    cooldown_hours: 6                    # vision-LLM step — keep below screenshots' 24h but above voice
    max_per_run: 20
  # Curiosity-loop consumer (scripts/curiosity/cli.py --run-oldest). Producer
  # in compile.py writes raw/requests/*.json; this task picks the oldest pending
  # one and runs the matching backend (email-deep-scan today).
  curiosity_followup:
    enabled: true
    cooldown_hours: 24
  retry_failed_flushes:
    enabled: true
    cooldown_hours: 24
    max_per_run: 5
  # M014 dream-cycle. Fires at most once-per-day; per-fire sweeps up to
  # max_per_run entity pages (newest-overdue first). Per-entity prompt-size cap
  # AND per-run cumulative token cap enforced inside dream.py — see
  # limits.dream_entity_max_prompt_chars / limits.dream_cycle_max_tokens_per_run.
  # Per-entity cooldown lives on scheduling.dream_cooldown_days (default 7d).
  dream_cycle:
    enabled: true
    cooldown_hours: 24
    max_per_run: 3
  # M019 operator-self-reports schedule dispatcher. 6h cooldown checks
  # 4×/day for studies whose schedule (weekly/monthly/quarterly) is due.
  # Default OFF — flip true after features.operator_reports lands and
  # S05 analyst layer dogfooded.
  study_run_due:
    enabled: false
    cooldown_hours: 6
  # M019-S05 Pass-2 analyst — cross-study synthesist. Pass-1 runs
  # automatically inside `wiki study run`; Pass-2 runs weekly on its
  # own cadence. Default OFF.
  analyst_pass2:
    enabled: false
    cooldown_hours: 168

models:
  # Claude model used by compile.py + retry-failed-flushes.
  compile_model: claude-opus-4-7
  # Compile fallback for sources >= limits.compile_large_source_chars.
  # Standard 200K Opus window dies silently on 100+ KB transcripts. The 1M
  # variant absorbs both the source and tool-turn reads. Set to empty string
  # to disable the auto-upgrade.
  compile_large_source_model: claude-opus-4-7[1m]
  # Folder-scan answer provider (watched-folder curiosity). The backend
  # reads an operator-approved file in-place and distills an
  # answer-extract. "claude-sdk" is the only provider today; a local
  # LLM/agent provider is the long-term target. Unknown values raise.
  folder_scan_provider: claude-sdk
  # Ollama endpoint (used by all local LLM calls).
  ollama_url: http://localhost:11434
  # Vision model for screenshot OCR.
  vision_model: gemma4:e4b
  # Curiosity-loop model (compile.py post-pass). Picks via 3 constraints:
  #   1. Honors Ollama JSON-Schema (gemma4:e4b doesn't — invents own fields)
  #   2. Context window fits the curiosity prompt (~22-25k tokens at vault
  #      sizes ≥ 700 articles — phi4:14b's 16k window silently truncates and
  #      the model hallucinates topics from index fragments)
  #   3. Quality on instruction-follow + reasoning
  # llama3.1:8b clears all three (MT 9.14, 128k ctx, schema ✓, local/free).
  curiosity_model: llama3.1:8b
  # Inbox classifier.
  classify_model: gemma4:e4b

limits:
  # Compile-run caps (protection against the 5h Opus rate-limit window).
  compile_max_files: 30
  compile_max_consecutive_failures: 3
  # Flush-extraction retries.
  flush_max_retries: 3
  flush_retry_delay_seconds: 30
  # Per-class budgets for the session/pre-compact context the flush extractor
  # sees. Replaced the content-blind MAX_TURNS=30 / MAX_CONTEXT_CHARS=15_000
  # globals on 2026-05-16 after a long ROM-analysis session lost all assistant
  # prose into truncated tool dumps. Allocation is prefer-tail.
  flush_assistant_text_budget_chars: 50000
  flush_user_text_budget_chars: 10000
  flush_tool_summary_budget_chars: 10000
  # Screenshot OCR.
  screenshot_resize_width: 512
  screenshot_timeout_seconds: 60
  # TCP connect cap for every Ollama call. A single httpx timeout makes
  # connect == read, so a down/sleeping LAN GPU would burn the full read
  # budget just failing to connect. Keepalive (engine constant) is what
  # bounds a half-open ESTABLISHED socket — review-wiki 19h-hang fix 2026-05-30.
  ollama_connect_timeout_s: 10
  # Hard cap the piggyback runner enforces on every detached piggyback task.
  # Backstop against a hung child (the review-wiki hang ran 19h47m unbounded).
  # 4h is generous for a full review-wiki sweep.
  piggyback_max_runtime_s: 14400
  # review-wiki.py: per-article Ollama read timeout, consecutive-failure abort
  # (stop grinding 1700×timeout when kcma is down), and incremental-report
  # checkpoint cadence (don't lose a multi-hour partial sweep).
  review_ollama_timeout_s: 300
  review_consecutive_failure_abort: 5
  review_checkpoint_every: 25
  # Voice-punctuate Ollama timeout (collectors/voice.py). gemma4:e4b
  # cold-call into VRAM takes 30–40 s; warm run ~5–15 s. 120 s default
  # absorbs the cold-start; lower it if the operator's Ollama always-on.
  voice_punctuate_timeout_s: 120
  # Curiosity-loop: max requests per compile run.
  curiosity_max_gaps: 3
  curiosity_min_source_chars: 500
  curiosity_timeout_s: 240               # ollama gap-detection call (gemma4:e4b on long YT-notes >90s)
  # Pre-flight cap for the curiosity prompt — index_md is truncated in-place
  # if total exceeds this. Keep some headroom under the picked model's
  # context window (llama3.1:8b = 128k = ~430K chars).
  curiosity_max_prompt_chars: 250000
  # Source-type allowlist for curiosity. Only sources whose path matches one
  # of these fnmatch globs trigger a curiosity pass. Memories / knowledge /
  # hard-facts get skipped — they're cognitive self-notes with no email
  # correspondence to scan for. Empty list = run on all sources.
  curiosity_source_globs:
    - "raw/transcripts/*"
    - "raw/articles/*"
    - "raw/notes/*"
    - "daily/*"
  # Denylist subtracted from the allowlist above — both curiosity passes
  # (regular + folder) skip a matching source BEFORE the Ollama call. Default
  # excludes email-deep-scan outputs (`raw/notes/email/deep-*.md`): they're
  # themselves curiosity outputs, so re-scanning them is circular (58% "no
  # gaps" + 79% duplicate-drops on lxw) and adds ~10-25 s Ollama per compile.
  # Empty list = no exclusions.
  curiosity_exclude_globs:
    - "raw/notes/email/deep-*"
  # Minimum self-reported folder-pick confidence (1-5). The LLM rates how
  # confident it is that the picked folder actually contains relevant mail.
  # Below this threshold the gap is dropped (telemetry: folder_low_confidence).
  # Forces explicit abstention instead of "INBOX/COMPANY/00 COMPANY" hedging.
  curiosity_folder_confidence_min: 3
  # When the digests overflow the prompt budget, inject the top-N
  # rarity-ranked candidate files (not the folder tree) — the model
  # judges a short candidate list. Keep small so a local 8B model
  # stays fast under schema-constrained decoding.
  curiosity_folder_max_candidates: 40
  # source_quote gate: accept the quote if ANY contiguous N-token window from
  # the normalised quote appears verbatim in the normalised source excerpt.
  # 5 = a 5-word verbatim block; lower = more permissive, higher = stricter.
  curiosity_quote_min_anchor_tokens: 5
  # Lint.
  sparse_threshold_words: 200
  # Connection-article quality gate (M012). type:connection bodies below
  # this word count fire `connection_shallow_body` in lint — they almost
  # always restate concepts side-by-side instead of asserting a real
  # mechanism / contrast / dependency.
  connection_min_words: 50
  # M019 default lookback window for operator-self-report instruments (PHQ-9,
  # GAD-7, ASRS-v1.1, WHO-5, MEQ-19 in the wedge). 14 = "last 2 weeks", the
  # standard clinical reference window. Per-instrument override via the
  # `inference.default_lookback_days` field in `instrument.yaml`.
  reports_default_lookback_days: 14
  # YouTube ingest (collectors/scan_youtube.py).
  youtube_max_frames: 30                 # Tier-3 visual: cap frames per video
  youtube_max_duration_s: 10800          # Tier-3: skip videos longer than this (default 3h)
  youtube_frame_resize_width: 512        # ffmpeg downscale before vision model
  youtube_vision_timeout_s: 90           # per-frame ollama call timeout
  youtube_aggregate_timeout_s: 300       # final synthesis call timeout
  # Jamie ingest (collectors/jamie.py).
  jamie_request_timeout_s: 30            # per-HTTP-call timeout against api.meetjamie.ai
  jamie_max_per_run: 50                  # default cap per account (per-account override is the jamie sub-block's max_per_run)
  # Google Meet ingest (collectors/gmeet.py — multi-tenant; per-account override
  # is the gmeet sub-block's max_per_run under personal.accounts.<id>.gmeet).
  gmeet_request_timeout_s: 30            # per-HTTP-call timeout against the Drive API
  gmeet_max_per_run: 50                  # default cap per account
  # Google Calendar ingest (collectors/calendar.py — multi-tenant; per-account
  # override is the calendar sub-block under personal.accounts.<id>.calendar).
  calendar_request_timeout_s: 30         # per-HTTP-call timeout against calendar.googleapis.com
  calendar_max_per_run: 500              # per-calendar event cap; selected calendars multiply
  calendar_backfill_days: 90             # default past window (in days) on first run
  calendar_future_days: 7                # default future window re-fetched every run for mutations
  # Claude Agent SDK per-message buffer (stream-json line buffer). SDK default 1 MB
  # trips on tool-result messages carrying large knowledge/index.md or Write/Edit
  # calls on big articles. 50 MB is safe headroom.
  sdk_max_buffer_size_mb: 50
  # Pre-flight cap for `wiki query` prompts — aborts with a clear message
  # before the SDK call if the knowledge base outgrows the context window.
  query_max_prompt_chars: 500000
  # Pre-flight cap for `wiki compile` prompts (same overflow class — source
  # size is the variable bit, gmeet transcripts can hit 100+ KB).
  compile_max_prompt_chars: 400000
  # Tool-turn ceiling per compile run. 12 was too tight for many-entity
  # bullet outlines (planning notes routinely need ~15-20 turns to
  # extract+link each bullet's concepts); 30 was high enough that large
  # sources looped on Read/Grep until hitting the 200K context window.
  # 20 lands in the daily-digest tier; per-file $ guard still bounds it.
  compile_max_turns: 20
  # Higher cap for substrates listed in compile_force_long_context_types.
  # Two-layer person/project pages with carry-forward (Read-existing →
  # Edit-State → maybe re-Edit) consume far more turns than the flat
  # atomic shape; a dense calendar-rollup with 6 attendees needs ~20
  # turns. Hitting max_turns burns ~$3-4/attempt at [1m] pricing for
  # nothing and surfaces as `subtype=error_max_turns` on the
  # ResultMessage — the bigger cap is the cheaper end of the trade-off.
  compile_max_turns_long_context: 30
  # Hard per-file TOKEN guard. When a single compile_file call's total token
  # use (input+output) exceeds this, the file is marked failed with
  # kind=tokens_exceeded and the BATCH ABORTS (not skips — operator must
  # intervene). Defense against substrate-prompt-mismatch fan-out loops. Set
  # to 0 to disable. Usage is tracked in tokens per provider/model, never USD
  # (see state/usage.json). Re-tune from that ledger once real data accrues.
  compile_max_tokens_per_file: 500000
  # Substrate types skipped entirely in batch mode (frontmatter
  # `type:` value). Operator can still force-compile single files via
  # `wiki compile --file <path>`. Empty by default — this is the
  # last-resort hatch for substrate types with no good prompt yet.
  # SUBSTRATE_PROMPTS (in compile.py) covers calendar-rollup and
  # daily-digest with dedicated lean prompts, so neither needs to be
  # skipped. `folder-index` = body-blind watched-folder digests under
  # raw/index/ (M027) — metadata for the curiosity producer, nothing to
  # distil (the raw/notes/folder/ answers stay compile sources).
  compile_skip_substrate_types: ["email-delta", "folder-index"]
  # Watched-folder index knobs (`wiki index`). The digest is always the
  # complete inventory (no write-time truncation — the producer trims or
  # greps at consumption). max_depth 0 = unlimited; raise only as a
  # walk-cost bound for huge NAS roots. recent_n = top-N recent changes.
  folder_index_max_depth: 0
  folder_index_recent_n: 20
  # Email daily-rollup signal (beta). The per-account block in
  # daily/<date>/email.md carries top-N senders + a sample of recent subjects
  # beyond the bare count, so the daily-digest agent can lift correspondents +
  # themes into the portrait. Set either to 0 to drop that part. Bodies stay
  # curiosity-on-request.
  daily_email_top_senders: 5
  daily_email_sample_subjects: 12
  # Surface an INFO line when source ≥ this many chars (logging signal only).
  compile_large_source_chars: 50000
  # Per-compile-call timeout (seconds). Guards against the bundled CLI
  # subprocess HANGING (vs crashing — crashes already retry/abort). One
  # stuck file otherwise blocks every remaining file in the batch. On
  # timeout: log WARNING, skip the file (preserves consecutive-failure
  # budget). 600 s = 10 min covers known legitimate long compiles; lower
  # it if your sources are smaller. Set 0 to disable.
  compile_per_call_timeout_s: 600
  # Retry once with `models.compile_large_source_model` on kind=unknown
  # (the silent exit-1 / empty-stderr signature of mid-stream context
  # overflow from tool-turn fan-out into knowledge/). Catches the
  # stochastic overflows on small sources that the size-threshold above
  # misses. Set to false to skip the retry and surface the failure.
  compile_retry_long_context_on_unknown: true
  # Escape-hatch list: substrate types still routed through
  # compile_main.md that legitimately need [1m] up-front. Empty by
  # default since 2026-05-16 P2 — both daily-digest and calendar-rollup
  # moved to dedicated lean prompts (SUBSTRATE_PROMPTS in compile.py),
  # so this list has no entries now. Add a type here ONLY if (a) it
  # still uses compile_main.md and (b) it reliably overflows 200K.
  compile_force_long_context_types: []
  # When a kind=unknown failure cannot be retried (small source OR
  # already on the long-context model), treat it as a skip instead of a
  # hard failure — preserves the consecutive-failure budget so the batch
  # survives a structurally-unprocessable file. Set to false to surface
  # every kind=unknown as a failure (legacy pre-2026-05-15 behavior).
  compile_skip_on_long_context_unknown: true
  # Circuit-breaker for memory-seed/memory-sync chunked compiles. When the
  # substrate splits an aggregated dump into N per-section chunks and the
  # first few all hit max_turns at $0.30-0.40 each (substrate-prompt
  # mismatch), the chunk loop is aborted to stop the $-bleed. Cumulative
  # cost guard — the per-file cost cap fires per-chunk and can't see the
  # total. Set 0 to disable.
  compile_aggregated_max_consecutive_failures: 3
  # When true (default), files without explicit `compile_role:` frontmatter
  # get a role inferred from their top-level segment (raw/daily/inbox/knowledge
  # → source-only). Set false to require explicit frontmatter on every file
  # (useful if you have non-standard top-level folders).
  compile_role_default_by_location: true
  # M011 takes substrate (third-party belief attribution). fnmatch globs
  # limiting which sources get an extract-takes pass after compile (gated
  # by `features.extract_takes`).
  extract_takes_source_globs:
    - "raw/transcripts/*"
    - "raw/transcripts/**/*"
    - "raw/voice/*"
    - "daily/*"
  extract_takes_timeout_s: 180
  extract_takes_max_per_source: 12
  # M014 dream-cycle resource gates (tokens, not dollars). Per-entity prompt-
  # SIZE cap in chars (SDK call REJECTED when the corpus prompt exceeds it — a
  # context-overflow guard). Cumulative per-run TOKEN cap stops the sweep once
  # real input+output tokens cross it. Both apply to `wiki dream
  # --all-entities` AND the dream_cycle piggyback.
  dream_entity_max_prompt_chars: 415000
  dream_cycle_max_tokens_per_run: 2000000
  # Concept-reconciliation routine (`wiki reconcile`). Structural gates, not
  # dollars: skip a fact violating more than max_files_per_fact concepts (too
  # broad — manual review), cap facts per run, and the turn budget for the
  # strict scoped agent. Token usage is recorded to state/usage.json.
  concept_reconcile_max_files_per_fact: 25
  concept_reconcile_max_facts_per_run: 10
  concept_reconcile_max_turns: 15
  # Turn budget for operator-driven `wiki correct apply` (propagates one fact
  # across the whole vault — broader than concept_reconcile, so larger).
  correct_apply_max_turns: 50
  # `wiki correct add` warns when a negation_term matches more than this many
  # articles (over-broad terms → lint noise / large apply blast radius).
  correct_broad_term_threshold: 15
  # Health-trend synthesis (`wiki health-trends`). Recent-window (months) for the
  # trend arrow + "recent avg"; min coverage (days) for a metric to be shown.
  health_trends_recent_months: 6
  health_trends_min_coverage_days: 10
  # M016 dream-cycle sampled-activation. Bounds corpus size per dream by
  # construction (~600 KB total regardless of vault size). Tier 1 always
  # includes the N most-recent substrate files mentioning the entity + the
  # last M daily digests + the entity page itself + any operator-authored
  # content (author: slug, compile_role: source-and-final). Tier 2 samples K
  # older substrate files via importance × recency × dreams_since_last_seen
  # weighting. Files cycle through Tier 2 over time via a `last_dreamed_at:`
  # frontmatter stamp written after each dream. See
  # `.ytstack/backlog/dream-sampled-activation.md` for the full architecture.
  dream_tier1_recent_count: 20
  dream_tier1_digest_days: 7
  dream_tier2_sample_count: 50
  # `wiki dedup` (entity-dedup, issue #3). Fuzzy-title match floor 0..1 for a
  # pair to be proposed as a duplicate candidate. Phonetic-key collisions +
  # shared `compiled_from` sources are proposed regardless of this floor.
  dedup_fuzzy_threshold: 0.85

features:
  # Pre-process voice transcripts through Ollama (classify_model = gemma4:e4b
  # by default) to add punctuation, sentence-case, and German-noun
  # capitalization. The original is preserved in the voice-note's
  # `raw_transcript:` frontmatter. Set false to skip the LLM call and store
  # the raw transcript as-is.
  voice_punctuate: true
  # Master switches for entire capabilities.
  curiosity_loop: true
  vision_screenshots: true
  procmail_execution: true
  # Pre-compile sweep of <vault>/Clippings/*.md into <vault>/raw/articles/.
  # Set to false if you've reconfigured the Obsidian Web Clipper extension
  # to drop clippings directly into raw/articles/.
  clippings_sweep: true
  # M011 master switch — default OFF; flip on after dogfooding.
  extract_takes: false
  # Dream web-research (issue #2) — default OFF. When on, `wiki dream <slug>`
  # researches PUBLIC entities (founders/execs/speakers) via Exa AI and writes
  # a sentinel-managed `## Public Profile` block. Makes an EXTERNAL paid API
  # call; doubly gated by this flag AND per-entity opt-in (`web_research: true`
  # frontmatter or the `public-person` tag). Never feeds back into raw/.
  dream_web_research: false
  # Source-glob allowlist for the suggestions post-pass (Producer-seam arc).
  # fnmatch patterns matched against source paths relative to ROOT_DIR.
  # Default mirrors the legacy hardcoded `_is_email_source` filter; widen to
  # enable suggestions for other substrates.
  suggestions_source_globs:
    - "raw/email/*.md"
  # Path-scope enforcement for compile + dream agent Write/Edit calls via a
  # `can_use_tool` callback (Python-side gate). The previous defense —
  # `"Write(knowledge/**)"` / `"Edit(knowledge/**)"` in `--allowedTools` —
  # is decorative: the bundled Claude Code CLI parses it as bare Write/Edit
  # and ignores the path glob (verified empirically by
  # `scripts/probe_compile_scope.py` on 2026-05-17). When true the agent
  # runs in streaming mode with the callback as the actual gate; when
  # false the engine reverts to the decorative allowlist for one-line
  # rollback if streaming-mode surfaces edge cases under production load.
  compile_callback_gate: true
  # Corpus-wide post-compile pass that writes a sentinel-managed
  # `## Backlinks` footer into every knowledge/<article>.md so AI agents
  # reading the markdown directly get backlink information without a
  # corpus-wide ripgrep. Idempotent — unchanged corpus produces zero writes.
  # Flip false to skip the sweep (e.g. to compare compile timing without
  # the O(corpus) extra read/write).
  materialize_backlinks: true
  # Corpus-wide post-compile pass that rewrites every wikilink to a path
  # relative to its containing article. Obsidian resolves a slash-bearing
  # link against the vault root, so the legacy `[[concepts/foo]]` form
  # (relative to knowledge/) created empty stubs when clicked from a nested
  # article. Idempotent — already-relative links produce zero writes.
  relativize_wikilinks: true
  # M019 operator-self-reports surface master switch. When true, `wiki study
  # run` and `wiki analyze` are wired and the flush.py piggyback orchestration
  # (per-study Pass-1 after each run; cross-study Pass-2 on its own schedule,
  # lands in S05) fires. Default OFF — flip true after the S05 analyst-agent
  # layer lands and dogfooding completes. Air-gapped from the compile loop;
  # see `.ytstack/DECISIONS.md` 2026-05-17 entries.
  operator_reports: false
  # Autonomous concept-consistency routine (`wiki reconcile`). When true, the
  # concept_reconcile piggyback (and `wiki reconcile --apply`) may make scoped
  # autonomous edits to knowledge/concepts/ — reconciling concepts against the
  # hard facts they contradict. Default OFF: review `wiki reconcile` (dry-run)
  # first, then flip. Also needs a `piggybacks.concept_reconcile` block to run
  # automatically. Spec: `.ytstack/backlog/concept-consistency-routine.md`.
  concept_reconciliation: false
  # Health-trend synthesis (`wiki health-trends`). Deterministic + $0. When true,
  # writes a `## Trends` block into concepts/health.md + the health_trends
  # piggyback runs. Safe to enable. Spec: health-trend-synthesis.md.
  health_trends: false
  # Pre-flight no-op skip for dream-entity passes whose corpus carries ZERO
  # entity-specific substrate — only date-pulled daily digests that don't
  # mention the entity. Such a pass is a guaranteed INSUFFICIENT_CORPUS no-op
  # but still bills a full prompt-cache write (~$0.80/entity). True → skip the
  # SDK call for $0 (the entity is picked up again once real substrate
  # accumulates). Set false to force a digests-only synthesis attempt.
  dream_require_entity_substrate: true

graph_view:
  # Mode: knowledge-only | full-vault | sources-only | custom
  # (applied to .obsidian/graph.json when the plugin builds.)
  mode: knowledge-only
  custom_search: ""

skills:
  # When true, `wiki skills install` / `wiki skills sync` also link
  # global-eligible skills (currently: use-llm-wiki) into ~/.claude/skills/
  # and register this vault in ~/.config/llm-wiki/vaults — so agents working
  # in *any* project can discover and query this wiki. Default false keeps
  # the install vault-local. Toggle via `wiki skills install --global` /
  # `--no-global`, the setup wizard, or `wiki config set skills.global_install`.
  global_install: false

# Per-instance, do-not-commit. Drives compile_curiosity.md, compile_suggestion.md,
# scan_screenshots_vision.md, and the email collector so committed files stay free of
# personal data. Empty defaults are fine; consumers handle absent values gracefully.
personal:
  # default account; used for prompt rendering + as a fallback in compile.py
  primary_account: ""
  # Path to local Thunderbird profile dir (mbox roots live under here).
  # Empty string disables the Thunderbird-mbox path of the email collector.
  thunderbird_profile: ""
  # Path to a local Firefox profile directory. Examples:
  #   macOS:   ~/Library/Application Support/Firefox/Profiles/<id>.default-release
  #   Linux:   ~/.mozilla/firefox/<id>.default-release
  # Empty string disables the Firefox half of the browser collector.
  firefox_profile: ""
  # Dream web-research (issue #2). Exa AI API key. Prefer setting it in the
  # vault's .claude/.env as `EXA_API_KEY=...` (this field falls back to that
  # env var when blank). Empty = the web-research post-pass stays inert even
  # with `features.dream_web_research: true`.
  exa_api_key: ""
  # Path to a Simple Tab Groups (STG) backup directory (where the extension
  # writes its periodic *.json snapshots). Empty string disables STG imports.
  stg_backup_dir: ""
  # Directory the operator dumps dictation transcripts into. Any tool that
  # writes a .txt or .md works (OpenWhispr is the default recommendation;
  # FluidVoice, macOS dictation, Hammerspoon snippets also work). Audio
  # files (.m4a / .wav / .mp3 / .flac / .ogg / .aac / .mp4) are transcribed
  # via whisper.cpp when `voice_transcribe_model` is set; see knobs below.
  # The voice collector scans this directory, ingests new files into
  # raw/voice/, then moves the source under raw/inbox-mobile/voice/.
  # Empty = disabled.
  voice_inbox: ""
  # Audio-transcription via whisper.cpp. Operator pre-reqs:
  #   brew install whisper-cpp
  #   mkdir -p ~/whisper-models && cd ~/whisper-models && \
  #     curl -LO https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
  # Then point `voice_transcribe_model` at the .bin file. Empty = audio
  # ingest disabled (audio files dropped into voice_inbox are left in
  # place; text dictation continues to work).
  voice_transcribe_model: ""
  # Language hint for whisper-cli. "auto" detects per-file (slightly
  # slower); "de" / "en" / etc. skip detection.
  voice_transcribe_language: "auto"
  # whisper-cli -t N. Default 4 is sane on current Apple Silicon.
  voice_transcribe_threads: 4
  # Override binary path. Empty = `whisper-cli` from $PATH.
  voice_transcribe_binary: ""
  # Override ffmpeg path. Empty = `ffmpeg` from $PATH. Only required for
  # audio formats whisper-cli doesn't natively read (m4a/mp4/aac).
  voice_transcribe_ffmpeg: ""
  # Directory the operator drops camera / phone photos into for ingest.
  # Mirrors `voice_inbox` (folder-watch + archive-as-dedup) but each file
  # goes through the gemma4 vision pipeline before write. Accepts .jpeg /
  # .jpg / .png / .heic. Writes a HOME sidecar + a batch report under
  # raw/notes/pictures/, then moves the source under
  # raw/inbox-mobile/pictures/. Typical setup: iOS Shortcut writing into
  # an iCloud Drive folder. Empty = disabled.
  #
  # Also accepts a list of paths (2026-05-28+) — operator points the
  # collector at multiple source folders at once (e.g. an iCloud-Drive
  # folder + an `inbox_bridges`-mirrored Google Drive folder). Per-run
  # scan walks every configured path; results aggregate into one batch
  # report; missing paths log a WARNING and are skipped without aborting
  # the others. Example multi-path:
  #   picture_inbox:
  #     - "~/Library/Mobile Documents/com~apple~CloudDocs/inbox/pictures"
  #     - "~/wiki-inbox-local/screenshots-tablet"
  picture_inbox: ""
  # 2026-05-28 inbox-bridge. Mirror folders from network-mounted / sandbox-
  # restricted paths (e.g. ~/Library/CloudStorage/GoogleDrive-…) into local
  # paths the substrate collectors can read freely. Solves macOS-TCC:
  # Claude-Code-spawned subprocesses can't open CloudStorage, but user-shell
  # + LaunchAgent processes can. The bridge runs `rsync -rt` per mapping;
  # mode=move (default) drains the remote on every sync via
  # `--remove-source-files` (prevents re-ingestion when the downstream
  # collector archives the file out of `local`). Substrate-agnostic — wire
  # each mapping's `local` into the matching `*_inbox` key separately.
  # Empty list = bridge off. Run `wiki bridge sync` (or via the LaunchAgent
  # template at templates/.launchd/com.llm-wiki.bridge.plist.template).
  # Example:
  #   inbox_bridges:
  #     - name:   screenshots-tablet
  #       remote: "/Users/alex/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive/wiki-inbox/pictures/screenshots-tablet"
  #       local:  "~/wiki-inbox-local/screenshots-tablet"
  #       mode:   move          # move (default) or copy
  #       enabled: true         # optional, defaults true
  inbox_bridges: []
  # M027 watched-folder curiosity. Folders the curiosity loop may scan as
  # substrate (local dirs + remote NAS shares). A body-blind METADATA index is
  # built from these — filenames / folder structure / size / mtime — so the
  # agent knows what's available. The producer then PROPOSES reading specific
  # files; the operator approves each read in the curiosity walk (that approval
  # is the content/cloud gate — real file bodies are only loaded on accept).
  # Each entry: id (stable handle), kind (local|smb), path (local) or share
  # (smb), optional include/exclude globs. Empty list = feature off.
  # Example:
  #   watched_folders:
  #     - id:   docs-private
  #       kind: local
  #       path: "~/Sync/Private/Documents"
  #       exclude: ["**/.git/**"]
  #       # optional free-vocabulary tag, stamped into every answer
  #       # artifact from this root and propagated by compile onto
  #       # derived knowledge/ articles. Marking only — the per-request
  #       # approval walk remains the content gate.
  #       sensitivity: private
  #     - id:    nas-multimedia
  #       kind:  smb
  #       share: Multimedia
  watched_folders: []
  # M025 quick-capture inbox. Directory the operator one-taps cryptic notes
  # into (iOS Shortcut → iCloud Drive is the mobile-primary path). The capture
  # collector folder-watches it, content-IDs each capture, writes
  # raw/captures/capture-<id>.md, and two-zone-archives the source under
  # raw/inbox-mobile/captures/. The capture-ID is the join-key the correction
  # back-channel (S03) keys on. Empty = disabled (graceful agnostic).
  capture_inbox: ""
  # M019 operator-self-reports surface. Directory under vault root where
  # `reports/studies/<id>/runs/<ts>/*.md` (deterministic study output) and
  # `reports/analyses/<ts>.md` (analyst-agent output, lands in S05) accumulate.
  # Sibling of `knowledge/`. Operator may rename to "analyses" or any slug;
  # the COMPILE_SUBSTRATE_EXCLUDED_PREFIXES air-gap pins the actual value.
  reports_dir: "reports"
  # Single-tenant fallback for author-attribution. When set (e.g. "alex"), the
  # compile prompt treats files lacking an explicit `author:` frontmatter key
  # as operator-authored — beliefs/decisions/opinions get routed to that
  # person's `knowledge/people/<value>.md`. Leave null for multi-tenant vaults
  # (unattributed content stays generic). Explicit `author:` always wins.
  # Example:  implicit_operator_author: "alex"
  implicit_operator_author: null
  # M013 (2026-05-16): optional `domain:` frontmatter axis on knowledge/
  # articles. Cross-cutting life-domain tag (NOT a folder). Extensible per
  # vault. Lint `check_domain_value` warns when an article carries a
  # `domain:` value outside this list (warning, not error — grace period
  # for typos / new domains). `wiki query --domain <value>` filters answers
  # to articles whose `domain:` matches. Empty list = feature off.
  # Lifted from the lx-vault audit (Company / Personal / AI top-level
  # split). See `.ytstack/backlog/domain-frontmatter.md`.
  domains:
    - company    # Yesterday-related, work, business strategy
    - personal   # health, family, apartment, side-interests
    - ai         # AI tooling, agent infra, prompt engineering
    - meta       # the wiki engine itself, ytstack, llm-wiki maintenance
  # Issue #4: output prose language of compiled `knowledge/**` articles.
  # "auto" (default) = write in the source material's language (today's
  # behavior, byte-identical compile). Set to a language ("de", "German",
  # "fr", …) to force ALL compiled prose — titles, body, summaries — into
  # that language regardless of source, while keeping code, technical
  # identifiers, proper names, and the canonical structural section headers
  # (## State, ## Timeline, …) verbatim. Distinct from voice_transcribe_language
  # (that's input transcription; this is output prose).
  # Example:  output_language: "de"
  output_language: "auto"
  # account-id → {email, label, reader?, filter?, gmeet?, jamie?, …}
  # `reader`, `filter`, `gmeet`, `jamie` are nested blocks with a `kind`
  # discriminator plus kind-specific fields. resolve_reader / resolve_filter /
  # _resolve_gmeet_accounts / _resolve_jamie_accounts all dispatch on `kind`;
  # unknown kinds are silently skipped (graceful agnostic). Adding a new
  # account-bound collector? Same shape — see DECISIONS 2026-05-15
  # multi-tenant policy. Full kind-table: CONTEXT.md § Account.kind.
  #
  # Examples (uncomment one or more, fill in your data):
  #
  #   work:
  #     email: alex@example.com
  #     label: "Work"
  #     reader:
  #       kind: thunderbird-mbox
  #       mbox_paths: ["ImapMail/server/INBOX.mbox"]   # relative to thunderbird_profile
  #     filter:
  #       kind: all-inkl-procmail
  #       imap_pass_env: WORK_IMAP_PASS                 # env var holding the password
  #
  #   private:
  #     email: alex@gmail.com
  #     label: "Private"
  #     reader:
  #       kind: gmail-api                                # M002/S03 — read-side via Gmail API
  #     filter:
  #       kind: gmail-api                                # filter creation via Gmail API
  #     gmeet:
  #       kind: gmeet-api                                # collectors/gmeet.py — Drive export of Gemini Meet Docs
  #       drive_folder_id: ""                            # Drive folder id from URL; empty → auto-resolve by name
  #       drive_folder_name: "Meet Recordings"           # auto-resolve fallback name
  #       since: ""                                      # ISO date "2026-01-01"; empty = no backfill cap
  #       max_per_run: null                              # null = inherit CONFIG.limits.gmeet_max_per_run
  #       email_discovery:                               # 2nd discovery source: colleague-shared meetings announced by email
  #         enabled: true                                # scan this account's mailbox for gemini-notes links the own-Drive scan can't see
  #         senders: ["gemini-notes@google.com"]         # only follow Drive links in mails from these senders
  #         folder: "INBOX"                              # reader folder to scan (uses the account's configured reader)
  #         backfill_days: 30                            # windowed re-scan; Drive-file-id dedup makes it idempotent (raise once to backfill history)
  #     jamie:
  #       kind: jamie-api                                # collectors/jamie.py — Jamie AI meeting-notetaker
  #       api_key_env: JAMIE_PRIVATE_API_KEY             # env var holding the jk_... key; empty/unset disables this account
  #       key_type: personal                             # personal | workspace (selects route prefix)
  #       since: ""                                      # ISO date "2026-01-01"; empty = no backfill cap
  #       max_per_run: null                              # null = inherit CONFIG.limits.jamie_max_per_run
  #     calendar:
  #       kind: google-calendar                          # collectors/calendar.py — Google Calendar events as substrate
  #       include: []                                    # list of calendar ids or summaries; empty = all "selected: true" calendars (Google UI toggle)
  #       backfill_days: 90                              # past window per run; null = inherit CONFIG.limits.calendar_backfill_days
  #       future_days: 7                                 # future window re-fetched every run (catches mutations)
  #       since: ""                                      # ISO date "2026-01-01"; empty = no backfill cap (overrides backfill_days)
  #       max_per_run: null                              # null = inherit CONFIG.limits.calendar_max_per_run
  #     health:
  #       oura:
  #         kind: oura-pat                               # collectors/health.py — Oura Ring daily biometrics
  #         api_key_env: OURA_PRIVATE_PAT                # env var holding the Bearer PAT (free at cloud.ouraring.com/personal-access-tokens)
  #         backfill_days: null                          # null = inherit CONFIG.limits.oura_max_backfill_days (90)
  #       healthkit:
  #         kind: healthkit-xml-export                   # collectors/health.py Phase 2 (M023) — Apple Health bulk-ingest
  #         inbox_dir: ~/Library/Mobile Documents/com~apple~CloudDocs/inbox/health-export
  #                                                      # folder holding Export.xml (operator drops Health → Export All here)
  #                                                      # empty string = feature off for this account
  #         filename: Export.xml                         # default Export.xml; override for non-standard exports
  #
  # HealthKit notes (M023, 2026-05-19):
  #   - Streaming parser handles multi-GB Export.xml without OOM (iterparse + el.clear).
  #   - Records sourced from "Oura" are dropped to avoid double-counting against
  #     the Oura API path; Renpho weight, iPhone steps, Apple Watch workouts, and
  #     pre-Oura history flow in cleanly.
  #   - Re-ingest is hash-gated: unchanged Export.xml = no-op. Drop a fresh
  #     export into inbox_dir and run `wiki collect health` (or wait for the
  #     piggyback) to merge the long-tail timeline.
  #   - Per-day files at `raw/notes/health/<YYYY>/<date>--<account>.md` get
  #     HealthKit keys merged into existing Oura frontmatter; Oura keys win on
  #     overlap (sleep / hrv / scores), HealthKit adds weight, body composition,
  #     steps_total, distance, energy, flights climbed, workouts.
  #
  #   personal-gmail:                                    # no local client, no GCP project
  #     email: you@gmail.com
  #     label: "Personal Gmail"
  #     reader:
  #       kind: imap
  #       imap_host: imap.gmail.com
  #       imap_pass_env: IMAP_PERSONAL_GMAIL_PASS         # Google App Password: 16 lowercase chars, no spaces, needs 2FA
  #       # imap_user_env: ...                           # optional; omit → uses account.email
  #       # folders: [INBOX]                             # optional allowlist; omit → all folders
  accounts: {}
  # Folder list for the curiosity loop. Each entry: { path, desc }.
  # `path` strings also become the schema enum in compile.py — single
  # source of truth, no drift.
  email_folders: []
  # Optional subset of email_folder paths for the curiosity loop. If empty,
  # the loop uses all email_folders. Operator-curated allowlist lets you
  # exclude generic catch-alls (e.g. "INBOX/COMPANY/00 COMPANY", "INBOX")
  # that the LLM otherwise picks as a fallback when no specific folder fits.
  # Each entry must match a `path:` value in email_folders above.
  curiosity_folders: []
  # Concrete project/product names used as examples in scan_screenshots_vision.md.
  project_examples: []
